
services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_USE_POLLING=true
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      # Kod z hot-reloadem; baza SQLite ląduje w backend/app/data (ignorowane przez git).
      - ./backend/app:/app
    # Klucz Gemini (GEMINI_API_KEY) i pozostałe ustawienia — z pliku .env w katalogu głównym.
    env_file:
      - path: .env
        required: false
    environment:
      - DB_PATH=/app/data/udip.db
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
